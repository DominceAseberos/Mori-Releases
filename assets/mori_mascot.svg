<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2A1E45"/>
      <stop offset="100%" stop-color="#110E1D"/>
    </radialGradient>
    <radialGradient id="auroraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8A6FF" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#8A5CF6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8A5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="mascotShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#080410" flood-opacity="0.55"/>
    </filter>
    <clipPath id="squircleClip">
      <rect width="512" height="512" rx="115" ry="115"/>
    </clipPath>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="248"/>
    </clipPath>
  </defs>

  <!-- Background shape: Squircle -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bgGrad)"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="265" r="210" fill="url(#auroraGlow)" clip-path="url(#squircleClip)"/>

  <!-- Mori Mascot: 80x58 natural dimensions. Centered at X=256, Y=265 with scale 5.0 -->
  <!-- Bounding box: X in [8, 74] (center 41), Y in [6, 54] (center 30) -->
  <!-- Transform: translate(256 - 41*5.0, 268 - 30*5.0) = translate(51, 118) -->
  <g transform="translate(51, 118) scale(5.0)" filter="url(#mascotShadow)">
    <!-- Grounding Shadow under mascot -->
    <ellipse cx="41" cy="48.5" rx="33" ry="5.5" fill="#11091C" opacity="0.65"/>

    <!-- Fur Body -->
    <path d="M 9 38 Q 8 28 17 20 Q 15 1 31 13 Q 41 10 52 15 Q 65 4 65 23 Q 73 30 70 39 Q 73 50 47 50 Q 13 54 9 38 Z"
          fill="#F3E8FF" stroke="#241A38" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Ear Inners -->
    <ellipse cx="23.5" cy="16.5" rx="3.5" ry="2.5" fill="#241A38"/>
    <ellipse cx="59.0" cy="17.5" rx="3.0" ry="2.5" fill="#241A38"/>

    <!-- Left Eye and Cheek -->
    <ellipse cx="26" cy="35" rx="2.0" ry="3.0" fill="#241A38"/>
    <ellipse cx="25" cy="41.5" rx="4.0" ry="1.6" fill="#E49BEB"/>

    <!-- Right Eye and Cheek -->
    <ellipse cx="52" cy="35" rx="2.0" ry="3.0" fill="#241A38"/>
    <ellipse cx="51" cy="41.5" rx="4.0" ry="1.6" fill="#E49BEB"/>

    <!-- Peaceful Smile -->
    <path d="M 35 39.5 Q 39.5 44.5 44 39.5" fill="none" stroke="#241A38" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Subtle Rim Border -->
  <rect width="506" height="506" x="3" y="3" rx="112" ry="112" fill="none" stroke="#C8A6FF" stroke-width="2.5" stroke-opacity="0.25"/>
</svg>